# TODO: build your image and push it to Docker Hub on every push to your
# default branch.
#
# Use the repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN.
# Do NOT write a password or a token in this file.
#
# The Kubernetes nodes are x86_64, so build for linux/amd64.
name: Build and Push to Docker Hub

on:
  push:
    # GitHub names the first branch "main". The course repository uses
    # "master". Both names are here, so the pipeline runs either way.
    branches: [ master, main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      # Check out the code
      - uses: actions/checkout@v7

      # Log in to Docker Hub with the two secrets
      - name: DockerHub Login
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      # Build from your Dockerfile and push the image,
      #       for platform linux/amd64,
      #       tagged with the app version (for example 0.2) AND the commit SHA
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/a2-app:0.2
            ${{ secrets.DOCKERHUB_USERNAME }}/a2-app:${{ github.sha }}